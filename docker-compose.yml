services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: olivia
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olivia"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
