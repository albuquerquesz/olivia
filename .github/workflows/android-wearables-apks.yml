name: Olivia Wearables APKs

on:
  workflow_dispatch:
  push:
    branches: [prod]

concurrency:
  group: android-wearables-apks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This is the primary artifact workflow. It intentionally does not publish the legacy mock flavor.
# Required repository/environment secrets are documented in docs/ANDROID_CI_ARTIFACTS.md.
jobs:
  developer-wearables-debug:
    name: Wearables Developer + MockDeviceKit (debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      MWDAT_APPLICATION_ID: ${{ secrets.MWDAT_APPLICATION_ID }}
      MWDAT_CLIENT_TOKEN: ${{ secrets.MWDAT_CLIENT_TOKEN }}
      MWDAT_MOCK_DEVICE_KIT: "true"
      PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
      OLIVIA_GOOGLE_SERVICES_JSON_B64: ${{ secrets.OLIVIA_GOOGLE_SERVICES_JSON_B64 }}
      ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Injectar configuracao protegida do flavor glasses
        run: |
          set -euo pipefail
          for value in MWDAT_APPLICATION_ID MWDAT_CLIENT_TOKEN PICOVOICE_ACCESS_KEY OLIVIA_GOOGLE_SERVICES_JSON_B64 ANDROID_RELEASE_KEYSTORE_B64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            test -n "${!value}"
          done
          printf '%s' "$OLIVIA_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/src/glasses/google-services.json
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/olivia-release.keystore"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/olivia-release.keystore" >> "$GITHUB_ENV"
          gh release download internal-assets-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern picovoice-assets.zip \
            --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/picovoice-assets.zip" -d app/src/main/assets
          for asset in olivia_android.ppn porcupine_params_pt.pv olivia-rhino_pt_android_v4_1_0.rhn rhino_params_pt.pv; do
            test -f "app/src/main/assets/$asset"
          done

      - name: Build developer Wearables APK
        run: sh gradlew assembleGlassesDebug -Polivia.abiFilters=arm64-v8a -Polivia.signDeveloperWithRelease=true -Polivia.debugAppCheckProvider=play-integrity --no-daemon --no-configuration-cache

      - name: Hash do artefato developer
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/developer"
          cp app/build/outputs/apk/glasses/debug/app-glasses-debug.apk "$GITHUB_WORKSPACE/artifacts/developer/olivia-developer-wearables-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/artifacts/developer/olivia-developer-wearables-debug.apk" > "$GITHUB_WORKSPACE/artifacts/developer/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: olivia-developer-wearables-debug
          if-no-files-found: error
          path: artifacts/developer/*

  production-wearables-release:
    name: Wearables físico + Play Integrity (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      MWDAT_APPLICATION_ID: ${{ secrets.MWDAT_APPLICATION_ID }}
      MWDAT_CLIENT_TOKEN: ${{ secrets.MWDAT_CLIENT_TOKEN }}
      MWDAT_MOCK_DEVICE_KIT: "false"
      PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
      OLIVIA_GOOGLE_SERVICES_JSON_B64: ${{ secrets.OLIVIA_GOOGLE_SERVICES_JSON_B64 }}
      GH_TOKEN: ${{ github.token }}
      ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Injectar configuracao protegida e assinatura de release
        run: |
          set -euo pipefail
          for value in MWDAT_APPLICATION_ID MWDAT_CLIENT_TOKEN PICOVOICE_ACCESS_KEY OLIVIA_GOOGLE_SERVICES_JSON_B64 ANDROID_RELEASE_KEYSTORE_B64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            test -n "${!value}"
          done
          printf '%s' "$OLIVIA_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/src/glasses/google-services.json
          gh release download internal-assets-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern picovoice-assets.zip \
            --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/picovoice-assets.zip" -d app/src/main/assets
          for asset in olivia_android.ppn porcupine_params_pt.pv olivia-rhino_pt_android_v4_1_0.rhn rhino_params_pt.pv; do
            test -f "app/src/main/assets/$asset"
          done
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/olivia-release.keystore"
          export ANDROID_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/olivia-release.keystore"
          sh gradlew assembleGlassesRelease --no-daemon --no-configuration-cache

      - name: Hash do artefato production
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/production"
          cp app/build/outputs/apk/glasses/release/app-glasses-release.apk "$GITHUB_WORKSPACE/artifacts/production/olivia-production-wearables-release.apk"
          sha256sum "$GITHUB_WORKSPACE/artifacts/production/olivia-production-wearables-release.apk" > "$GITHUB_WORKSPACE/artifacts/production/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: olivia-production-wearables-release
          if-no-files-found: error
          path: artifacts/production/*
