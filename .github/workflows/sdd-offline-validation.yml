name: SDD offline validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/**"
      - "infra/testing/**"
      - "packages/env/**"
      - "docs/spec-driven-development/**"
      - ".github/workflows/sdd-offline-validation.yml"

permissions:
  contents: read

jobs:
  core-and-harness:
    name: Core contracts and offline harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Testar contratos JVM
        run: ./apps/android/gradlew -p infra/testing :core:test :core:integrationTest --no-daemon

      - name: Testar harness TypeScript/Bun
        run: bun test infra/testing/tests

      - name: Verificar configuração de build
        run: ./apps/android/gradlew -p infra/testing :core:check --no-daemon

      - name: Publicar relatórios JVM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdd-core-reports
          if-no-files-found: ignore
          path: |
            apps/android/core/build/test-results/**
            apps/android/core/build/reports/tests/**

  android-mock:
    name: Android mock and MockDeviceKit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Unitários Android
        working-directory: apps/android
        run: sh gradlew testMockDebugUnitTest testGlassesDebugUnitTest --no-daemon

      - name: Compilar APK mock legado
        working-directory: apps/android
        run: sh gradlew assembleMockDebug --no-daemon

      - name: Publicar APK mock
        uses: actions/upload-artifact@v4
        with:
          name: olivia-legacy-developer-mock-debug-sdd
          if-no-files-found: error
          path: apps/android/app/build/outputs/apk/mock/debug/*.apk
