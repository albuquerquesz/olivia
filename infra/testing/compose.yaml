services:
  core-contracts:
    profiles: [offline]
    build:
      context: ../..
      dockerfile: infra/testing/Core.Dockerfile
    network_mode: none
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    # Workspace/caches precisam de escrita para Gradle. Camada é descartável;
    # nenhum volume, porta, credencial ou diretório do host é montado.

  core-network:
    profiles: [offline]
    build:
      context: ../..
      dockerfile: infra/testing/Core.Dockerfile
    command: [":core:infrastructureTest", "--rerun-tasks"]
    environment:
      OLIVIA_STUB_URL: http://provider-stub:8080
    networks: [isolated]
    depends_on:
      provider-stub:
        condition: service_healthy
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    tmpfs: [/tmp:rw,nosuid,nodev,size=256m]

  harness-unit:
    profiles: [offline]
    build:
      context: ../..
      dockerfile: infra/testing/Tooling.Dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    tmpfs: [/tmp:rw,nosuid,nodev,size=64m]

  provider-stub:
    profiles: [offline]
    build:
      context: ../..
      dockerfile: infra/testing/Tooling.Dockerfile
    command: [infra/testing/stub.ts]
    networks: [isolated]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: [CMD, bun, --no-env-file, -e, "const r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)"]
      interval: 2s
      timeout: 2s
      retries: 15

  network-probe:
    profiles: [offline]
    build:
      context: ../..
      dockerfile: infra/testing/Tooling.Dockerfile
    command: [infra/testing/network-probe.ts]
    environment:
      OLIVIA_STUB_URL: http://provider-stub:8080
    depends_on:
      provider-stub:
        condition: service_healthy
    networks: [isolated]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m

  whisper:
    profiles: [whisper]
    build:
      context: ../..
      dockerfile: infra/testing/Whisper.Dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2
    tmpfs: [/tmp:rw,nosuid,nodev,size=512m]
    # Read-only model/fixture mounts and allowlisted env injected by run.ts.

networks:
  isolated:
    internal: true
